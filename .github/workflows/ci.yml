# 本仓库的 CI 只跑**测试与语法检查**，没有任何部署步骤。
# 对比 agent-mobile 的 deploy-web.yml：那边有 expo export / rsync / ssh / systemd restart / 线上 curl 验证，
# 本仓库没有服务器，故全部不存在。
#
# 包管理：本仓库统一用 pnpm（全局约定禁用 npm / npx，npx 由 pnpm dlx 代替）。
#
# 另注：本仓库 .gitignore 是白名单，现已放行全部 6 个插件目录 + docs/ + scripts/ + .github/，
# 因此 CI 检出后 6 个插件都在。下面的"目录不存在 → ::warning:: 跳过"分支保留作兜底
# （例如新插件目录还没加进白名单），命中它是预期行为，不是失败。
#
# dsh-im-bridge-workspaces：依赖已在 issue #3 修复，可正常 `pnpm install`（peer 已按
# 实测 DSH 0.2.1-rc.2 收窄，见 package.json）。但它**不做构建产物新鲜度检查**
# （`fresh: false`）：tsdown 打 client 包时把绝对路径与 CSS module 哈希写进产物，
# 换机器必然产出不同字节，重建即脏。
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: dsh-auto-upgrade
            install: true
            entry: |
              lib/index.js
              lib/client.js
          - dir: dsh-external-discuss
            install: true
            entry: |
              lib/index.js
              lib/client.js
              lib/host/http.js
              lib/host/transcript.js
              extension/background.js
              extension/dsh-content.js
              extension/qingyan-content.js
          - dir: dsh-im-bridge-workspaces
            install: true
            # 构建产物不可复现（绝对路径 + CSS 哈希），不做新鲜度检查。
            fresh: false
            entry: |
              lib/index.js
              lib/client.js
          - dir: dsh-plugin-memx
            install: true
            entry: |
              lib/index.js
              lib/client.js
              lib/config.js
          - dir: dsh-plugin-product-subagents
            install: true
            entry: |
              lib/index.js
          - dir: dsh-prompt-optimizer
            install: true
            entry: |
              lib/index.js
              lib/client.js
    steps:
      - uses: actions/checkout@v4

      - name: 探测插件目录是否存在
        id: presence
        run: |
          if [ -f "${{ matrix.dir }}/package.json" ]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::${{ matrix.dir }} 未被检出（本仓库 .gitignore 是白名单，或该插件是带独立 .git 的子仓），跳过本任务"
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/setup-node@v4
        if: steps.presence.outputs.exists == 'true'
        with:
          node-version: 24.21.0

      - uses: pnpm/action-setup@v4
        if: steps.presence.outputs.exists == 'true' && matrix.install
        with:
          version: 12

      - name: 安装依赖
        if: steps.presence.outputs.exists == 'true' && matrix.install
        working-directory: ${{ matrix.dir }}
        run: |
          # 各插件 lockfile 现状（决定 frozen-lockfile 成败）：
          #   * dsh-auto-upgrade            —— 有 pnpm-lock.yaml 且与 package.json 一致 → frozen 成功
          #   * dsh-external-discuss        —— 无任何 lockfile → ERR_PNPM_NO_LOCKFILE，走兜底
          #   * dsh-plugin-memx             —— 有 pnpm-lock.yaml 且与 package.json 一致 → frozen 成功
          #   * dsh-plugin-product-subagents —— 有 pnpm-lock.yaml 且与 package.json 一致 → frozen 成功
          #   * dsh-im-bridge-workspaces     —— 无 lockfile → ERR_PNPM_NO_LOCKFILE，走兜底
          # 本仓库只留 pnpm-lock.yaml：npm 的 package-lock.json 已按全局约定清掉，并被 .gitignore 挡下。
          #
          # ⚠️ CI 下 pnpm 默认 frozen-lockfile=true：兜底必须显式 --no-frozen-lockfile。
          #    写成 `|| pnpm install` 在 GitHub Actions 里同样会冻锁、救不回来（PR #4 实测红过一次）。
          pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      # 通用门禁：入库的构建产物必须与源码一致。
      # 做法：有 scripts.build 就在装好依赖后重建一遍，然后要求该目录在 git 里「零改动」；
      # 有改动说明提交上去的 lib/* 是过期的（或在 CI 里才被改写），直接判红。
      # 仓库根校验：本步骤 working-directory 是插件目录，故用 git -C "${GITHUB_WORKSPACE}"。
      - name: 构建产物新鲜度（有 scripts.build 才跑）
        if: steps.presence.outputs.exists == 'true' && matrix.install && matrix.fresh != false
        working-directory: ${{ matrix.dir }}
        run: |
          if node -e 'process.exit(require("./package.json").scripts && require("./package.json").scripts.build ? 0 : 1)'; then
            pnpm run build
            DIRTY=$(git -C "${GITHUB_WORKSPACE}" status --porcelain -- "${{ matrix.dir }}")
            if [ -n "${DIRTY}" ]; then
              echo "::error::构建产物与源码不一致：请在本地 pnpm run build 并提交 lib/*"
              echo "── git status --porcelain -- ${{ matrix.dir }} ──"
              printf '%s\n' "${DIRTY}"
              echo "── git diff --stat -- ${{ matrix.dir }} ──"
              git -C "${GITHUB_WORKSPACE}" diff --stat -- "${{ matrix.dir }}"
              exit 1
            fi
            echo "  ✓ 重建后工作区干净，产物新鲜"
          else
            echo "  - 无 scripts.build，跳过（该包不产生入库的构建产物）"
          fi

      - name: 运行测试（有 scripts.test 才跑）
        if: steps.presence.outputs.exists == 'true' && matrix.install
        working-directory: ${{ matrix.dir }}
        run: |
          if node -e 'process.exit(require("./package.json").scripts && require("./package.json").scripts.test ? 0 : 1)'; then
            pnpm test
          else
            echo "  - 无 scripts.test，跳过"
          fi

      - name: 运行 typecheck（有 scripts.typecheck 才跑）
        if: steps.presence.outputs.exists == 'true' && matrix.install
        working-directory: ${{ matrix.dir }}
        run: |
          if node -e 'process.exit(require("./package.json").scripts && require("./package.json").scripts.typecheck ? 0 : 1)'; then
            pnpm run typecheck
          else
            echo "  - 无 scripts.typecheck，跳过"
          fi

      - name: 运行 lint（有 scripts.lint 才跑）
        if: steps.presence.outputs.exists == 'true' && matrix.install
        working-directory: ${{ matrix.dir }}
        run: |
          if node -e 'process.exit(require("./package.json").scripts && require("./package.json").scripts.lint ? 0 : 1)'; then
            pnpm run lint
          else
            echo "  - 无 scripts.lint，跳过"
          fi

      - name: 语法检查（node --check 逐个入口）
        if: steps.presence.outputs.exists == 'true'
        working-directory: ${{ matrix.dir }}
        env:
          ENTRIES: ${{ matrix.entry }}
        run: |
          printf '%s\n' "${ENTRIES}" | while IFS= read -r f; do
            if [ -z "${f}" ]; then continue; fi
            if [ ! -f "${f}" ]; then
              echo "::warning::${{ matrix.dir }}: 入口不存在，跳过: ${f}"
              continue
            fi
            node --check "${f}"
            echo "  ✓ ${f}"
          done

  # pipeline 脚本自己的自测（issue #10）：纯 Node、零依赖，单独一个 job。
  pipeline-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: 语法检查
        run: node --check scripts/pipeline/audit-subagents.mjs

      - name: audit-subagents 单测（含内置 --self-test）
        run: node --test scripts/pipeline/audit-subagents.test.mjs
